name: build-main

# Manually build a container image from the selected branch (main by default)
# and publish it to the GHCR of the repository it runs in (so a fork builds
# into its own), tagged with the commit SHA plus a moving tag named after the
# branch. For testing unreleased changes — `latest` stays reserved for tagged
# releases (built by goreleaser on release-please cuts).
on:
  workflow_dispatch:
  push:
    branches: [fork-build]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve short commit SHA, image name and branch tag
        id: vars
        run: |
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; tags can't contain "/".
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "ref=$(echo "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.vars.outputs.ref }}-${{ steps.vars.outputs.sha }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.ref }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.vars.outputs.ref }}-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
